<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Neural network signal propagation</title>
<desc id="desc">Animated cyan and gold data signals travel from input neurons through two hidden layers toward prediction neurons.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="0.56" stop-color="#111B30"/><stop offset="1" stop-color="#0D1729"/></linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10BDAF"/><stop offset="0.55" stop-color="#317F96"/><stop offset="1" stop-color="#DAB875"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#17C9BE"/><stop offset="1" stop-color="#DCB874"/></linearGradient>
  <radialGradient id="cyanHalo"><stop stop-color="#17D8CD" stop-opacity="0.45"/><stop offset="1" stop-color="#17D8CD" stop-opacity="0"/></radialGradient>
  <radialGradient id="goldHalo"><stop stop-color="#F3CB82" stop-opacity="0.5"/><stop offset="1" stop-color="#F3CB82" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#82B6C7" stroke-opacity="0.07" stroke-width="1"/></pattern>
  <style>
    .title{font:700 29px system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#F1F6FB;letter-spacing:.3px}
    .sub{font:400 14px system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#91ACBD}
    .layer{font:600 13px system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#B6CEDB;letter-spacing:1.3px}
    .mini{font:500 12px system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#86A5B4}
    .wire{stroke:url(#wire);stroke-width:1.45;stroke-opacity:.18;fill:none}
    .inner{fill:#122B3D;stroke:#36CDC3;stroke-width:2}
    .out{fill:#372D2C;stroke:#E3BC73;stroke-width:2}
  </style>
</defs>
