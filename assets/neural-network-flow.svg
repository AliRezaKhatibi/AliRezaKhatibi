<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18C5C1"/>
      <stop offset="100%" stop-color="#D9B36C"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t{font-family:Segoe UI,Arial,sans-serif;fill:#E6EEF9}
      .h{font-size:28px;font-weight:700}.s{font-size:14px;fill:#9EB4C9}.l{font-size:15px;font-weight:600}.sm{font-size:12px;fill:#8EA4B8}
      .edge{stroke:url(#lineGrad);stroke-width:2.2;opacity:.32}.n1{fill:#102033;stroke:#18C5C1;stroke-width:2.6}.n2{fill:#132136;stroke:#57DCD7;stroke-width:2.6}.n3{fill:#1B2436;stroke:#D9B36C;stroke-width:2.6}
      .p1{fill:#20D0CB;filter:url(#glowCyan)} .p2{fill:#E9C98D;filter:url(#glowGold)}
    </style>
  </defs>
